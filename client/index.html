<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./assets/css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <title>Simple Expense Tracker</title>
</head>

<body>

  <div class="container">
    <div class="expense-card">
      <span class="expense-card-title">Total</span>
      <h1 class="expense-card-amount">Loading...</h1>
    </div>

    <div class="actions-bar">
      <div class="actions-bar-group">
        <div class="dropdown">
          <button class="ghost-btn">
            <i class="fa-solid fa-filter"></i>
          </button>
          <div class="dropdown-content">
            <div class="dropdown-title">Sort by</div>
            <div class="dropdown-actions">
              <button class="menu-btn sorting-handler" data-sort="default">Default</button>
              <button class="menu-btn sorting-handler" data-sort="highest">Highest</button>
              <button class="menu-btn sorting-handler" data-sort="lowest">Lowest</button>
            </div>
          </div>
        </div>
      </div>
      <input spellcheck="false" id="search" class="input-text" type="text" placeholder="Search expense" />
      <button id="create-expense-trigger" class="primary-btn">
        <i class="fa-solid fa-plus"></i>
      </button>
    </div>
    
    <div class="items-list-container">
      <ul class="items-list">
        <li class="item">
          <div class="item-wrapper">
            <span class="item-title">
              Lorem, ipsum dolor.
            </span>
            <span class="item-description">
              Lorem ipsum dolor sit amet, consectetur adipisicing elit.
            </span>
          </div>
          <div class="item-actions">
            <span class="item-category-badge">
              groceries
            </span>
            <button class="delete">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        </li>
      </ul>
    </div>
  </div>



  <dialog id="create-expense-modal">
    <button class="ghost-btn" id="create-expense-close">
      <i class="fa-solid fa-x"></i>
    </button>
    <form id="create-expense-form">
      <h2 class="title">Create Expense</h2>
      <div class="create-expense-field-wrapper">
        <label class="field-label" for="title">Title</label>
        <input class="input-text" name="title" id="title" type="text" placeholder="Enter expense title">
      </div>

      <div class="create-expense-field-group">
        <div class="create-expense-field-wrapper">
          <label class="field-label" for="category">Category</label>
          <input class="input-category" name="category" id="category" type="text" placeholder="Enter category">
        </div>

        <div class="create-expense-field-wrapper">
          <label class="field-label" for="amount">Amount</label>
          <input class="input-amount" name="amount" id="amount" type="number" step="0.01" placeholder="Enter amount">
        </div>
      </div>

      <div class="create-expense-field-wrapper">
        <label class="field-label" for="description">Description</label>
        <textarea cols="5" class="input-text" name="description" id="description"
          placeholder="Enter description"></textarea>
      </div>

      <div class="create-expense-field-wrapper">
        <button type="submit" id="create-expense-submit" type="submit" class="primary-btn">Create</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./assets/js/createExpense.js"></script>
  <script type="module" src="./assets/js/sortExpense.js"></script>
  <script type="module" src="./assets/js/store.js"></script>
  <script type="module" src="./assets/js/searchExpense.js"></script>
  <script type="module" src="./assets/js/main.js"></script>
  <script type="module" src="./assets/js/renderList.js"></script>
</body>

</html>
